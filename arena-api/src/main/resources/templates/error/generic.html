<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::main}, ~{})}"
      lang="en">
<head><title th:text="${heading} + ' · CodeArena'">Error</title></head>
<body>
<main>
    <div class="row justify-content-center text-center py-5">
        <div class="col-md-6">
            <p class="display-1 fw-bold text-muted" th:text="${status}">404</p>
            <h1 class="h4" th:text="${heading}">Not found</h1>
            <p class="text-muted" th:text="${message}">Something went wrong.</p>
            <a class="btn btn-primary mt-2" th:href="@{/}">Back to the home page</a>
            <a class="btn btn-outline-secondary mt-2" th:href="@{/problems}">Browse problems</a>
        </div>
    </div>
</main>
</body>
</html>
