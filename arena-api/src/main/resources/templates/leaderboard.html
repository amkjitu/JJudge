<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::main}, ~{})}"
      lang="en">
<head><title>Leaderboard &middot; CodeArena</title></head>
<body>
<main>

    <h1 class="h4 mb-3">Leaderboard</h1>
    <p class="text-muted small">
        Ranked by rating. Backed by two PostgreSQL queries today; Phase 5 moves the ranking into
        a Redis sorted set.
    </p>

    <div class="table-responsive">
        <table class="table align-middle bg-white">
            <thead class="table-light">
            <tr>
                <th scope="col" style="width: 4rem">#</th>
                <th scope="col">Player</th>
                <th scope="col" class="text-end">Solved</th>
                <th scope="col" class="text-end">Rating</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${entries}">
                <td class="text-muted" th:text="${entry.rank}">1</td>
                <td>
                    <a th:href="@{/users/{u}(u=${entry.username})}" th:text="${entry.username}"
                       class="text-decoration-none fw-semibold">carol</a>
                </td>
                <td class="text-end" th:text="${entry.solvedCount}">25</td>
                <td class="text-end">
                    <span class="badge text-bg-dark" th:text="${entry.rating}">1750</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</main>
</body>
</html>
