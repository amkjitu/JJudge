spring:
  application:
    name: arena-api

  datasource:
    url: ${ARENA_DB_URL:jdbc:postgresql://localhost:5432/codearena}
    username: ${ARENA_DB_USERNAME:codearena}
    password: ${ARENA_DB_PASSWORD:codearena}
    hikari:
      maximum-pool-size: ${ARENA_DB_POOL_SIZE:10}
      pool-name: arena-pool

  jpa:
    # Flyway owns the schema. 'validate' turns every entity/table mismatch into a startup
    # failure instead of a runtime surprise - it is effectively a free mapping test.
    hibernate:
      ddl-auto: validate
    # Off deliberately: lazy loading must happen inside a service transaction, not while a
    # Thymeleaf template renders.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
        # Collapses the N+1 that Specification-based queries would otherwise cause: a page of
        # 20 problems loads all their tags in one extra IN(...) query rather than 20 selects.
        # Entity graphs cannot be combined with findAll(Specification, Pageable).
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${ARENA_REDIS_HOST:localhost}
      port: ${ARENA_REDIS_PORT:6379}
      # Short, because every Redis call here has a PostgreSQL fallback and waiting seconds for a
      # cache that is already down turns a degraded page into a hung one.
      #
      # Not shorter, though: Lettuce bounds *connection initialisation* by this command timeout
      # rather than by connect-timeout, so it has to cover the handshake on a cold connection as
      # well as a round trip on a warm one. At 500ms a perfectly healthy Redis behind Docker port
      # forwarding fails to connect at all - and the failure surfaces as "Unable to connect",
      # which points at the network rather than at this line.
      timeout: ${ARENA_REDIS_TIMEOUT:2s}
      connect-timeout: ${ARENA_REDIS_CONNECT_TIMEOUT:2s}
    mongodb:
      uri: ${ARENA_MONGO_URI:mongodb://localhost:27017/codearena}
      # Auto-index-creation is off by default in Spring Data MongoDB and stays off here.
      # Building indexes as a side effect of the first write means the shape of the collection
      # depends on which application instance started first, and an index appearing under load
      # is a production incident rather than a deployment step. Indexes are declared explicitly
      # at startup instead - see MongoIndexConfig.
      auto-index-creation: false
    web:
      pageable:
        default-page-size: 20
        # Without a cap, ?size=1000000 is a free denial-of-service on every paged endpoint.
        max-page-size: 100
        one-indexed-parameters: false

  jackson:
    # Nullable fields (verdict, runtimeMs, statementMarkdown) are omitted rather than
    # serialised as explicit nulls, which keeps list payloads noticeably smaller.
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${ARENA_KAFKA_BOOTSTRAP:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # A submission acknowledged by one broker and then lost to a leader failure is a user
      # whose solution silently never gets judged.
      acks: all
      retries: 5
      properties:
        enable.idempotence: true

    consumer:
      group-id: arena-api
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        # Restricts polymorphic deserialisation to the shared event package - trusting arbitrary
        # class names from a message header is a remote-code-execution primitive.
        spring.json.trusted.packages: "com.codearena.common.event"
        spring.json.value.default.type: com.codearena.common.event.VerdictAssigned
        spring.json.use.type.headers: false

    listener:
      ack-mode: record
      # The judge may create the topics first, or the API may; neither should refuse to start
      # because the other has not booted yet.
      missing-topics-fatal: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

arena:
  kafka:
    verdict-consumers: ${ARENA_VERDICT_CONSUMERS:1}

  ai-client:
    # Hints and complexity analysis come from arena-ai. Off leaves the platform fully functional
    # minus those two features, which is the right default relationship: the AI service is an
    # enrichment, and nothing in the judging pipeline waits on it.
    enabled: ${ARENA_AI_CLIENT_ENABLED:true}
    base-url: ${ARENA_AI_URL:http://arena-ai:8090}
    connect-timeout: ${ARENA_AI_CONNECT_TIMEOUT:2s}
    # Longer than arena-ai's own model timeout, so its heuristic fallback gets a chance to
    # answer before this gives up on it. Setting this shorter would mean the fallback that
    # exists specifically for slow models never actually gets used.
    read-timeout: ${ARENA_AI_READ_TIMEOUT:30s}

  recommendation:
    # Weakness dominates on purpose: the product claims to surface what you are bad at, and the
    # weights should make that literally true rather than merely aspirational. Every term is
    # normalised to [0, 1] before weighting, so these numbers are directly comparable.
    # See RecommendationProperties for what each one does.
    weight-tag-weakness: ${ARENA_REC_W_WEAKNESS:0.45}
    weight-rating-fit: ${ARENA_REC_W_FIT:0.35}
    weight-recency: ${ARENA_REC_W_RECENCY:0.10}
    weight-repetition-penalty: ${ARENA_REC_W_REPETITION:0.30}
    # Asymmetric band: growth comes from stretching upwards, not from revisiting easier ground.
    rating-band-below: ${ARENA_REC_BAND_BELOW:100}
    rating-band-above: ${ARENA_REC_BAND_ABOVE:200}
    rating-stretch: ${ARENA_REC_STRETCH:100}
    max-per-tag: ${ARENA_REC_MAX_PER_TAG:2}

  jwt:
    # No default: the application must refuse to start rather than sign tokens with a key
    # that is published in this repository. .env.example carries a development value.
    secret: ${ARENA_JWT_SECRET}
    issuer: ${ARENA_JWT_ISSUER:codearena}
    # Short, because a signed JWT cannot be revoked before it expires.
    access-ttl: ${ARENA_JWT_ACCESS_TTL:15m}
    # Long, but revocable - refresh tokens are database rows, not JWTs.
    refresh-ttl: ${ARENA_JWT_REFRESH_TTL:7d}

  security:
    # A Secure cookie is never sent over plain HTTP, which would silently break local dev.
    # Must be true anywhere served over TLS.
    secure-cookies: ${ARENA_SECURE_COOKIES:false}

    # PERMIT leaves the seeded demo accounts exactly as migration V3 created them, which is what
    # you want on a laptop. LOCKED rotates the admin password and refuses to start without one -
    # see SeededAccountGuard for why that is fatal rather than a warning.
    seeded-accounts: ${ARENA_SECURITY_SEEDED_ACCOUNTS:PERMIT}
    admin-password: ${ARENA_ADMIN_PASSWORD:}
    # Visitors to a public demo need somebody to sign in as, so the demo users stay usable by
    # default even when the admin account is locked down.
    lock-demo-users: ${ARENA_LOCK_DEMO_USERS:false}

  oauth2:
    success-redirect: ${ARENA_OAUTH2_SUCCESS_REDIRECT:/}
    google:
      # Blank disables Google login entirely - see GoogleOAuth2Config.
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}

  rate-limit:
    enabled: ${ARENA_RATE_LIMIT_ENABLED:true}
    submissions-per-window: ${ARENA_RATE_LIMIT_SUBMISSIONS:10}
    window: ${ARENA_RATE_LIMIT_WINDOW:1m}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  level:
    com.codearena: ${ARENA_LOG_LEVEL:INFO}
    org.flywaydb: INFO
