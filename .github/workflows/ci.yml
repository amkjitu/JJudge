name: CI

# Pull requests and pushes to main. Not every branch push: the integration suite starts four
# containers and takes the best part of fifteen minutes, which is worth paying on the way into
# main and not on every work-in-progress commit.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  # A newer push supersedes an older run on the same ref. Two runs of this suite in parallel on a
  # 2-core runner would slow each other down and prove the same thing twice.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Testcontainers negotiates Docker API 1.32 by default, and modern engines answer anything
  # older with a bare HTTP 400 that surfaces as "Could not find a valid Docker environment".
  # docker-java reads this as a system property, so it goes to the forked test JVM via argLine -
  # the DOCKER_API_VERSION environment variable has no effect. See the root pom.
  MAVEN_ARGS: -B -ntp

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # The integration suite runs PostgreSQL, MongoDB, Redis and Kafka via Testcontainers. Kafka
    # is the slow one to become ready; 40 minutes leaves room without letting a hang run all day.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Pre-pull test container images
        # Testcontainers pulls these on first use, inside a startup timeout that a cold pull can
        # exceed - which fails the run for a reason that has nothing to do with the code. Pulling
        # here fails loudly and separately if a registry is having a bad day.
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull mongo:7
          docker pull apache/kafka:3.8.0

      - name: Build and run the full suite
        # `verify` runs unit tests (surefire) and integration tests (failsafe). Not `-DskipTests`
        # anywhere: a green CI badge that skipped the tests is worse than no badge.
        run: ./mvnw $MAVEN_ARGS verify

      - name: Publish test report
        # Runs even when the build failed - that is precisely when the report is worth reading.
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/*-reports/TEST-*.xml'
          include_passed: false
          detailed_summary: true

      - name: Upload surefire and failsafe reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/*-reports/'
          retention-days: 7

  sandbox:
    name: Prove the sandbox holds
    runs-on: ubuntu-latest
    needs: build
    # These are opt-in locally because they deliberately exhaust resources - a fork bomb, a memory
    # bomb and unbounded output, each of which is meant to hit a ceiling rather than the host. CI
    # is where they should run every time: the sandbox's whole value is a set of claims about what
    # hostile code cannot do, and an untested claim of that shape is worth nothing.
    #
    # Safe on a runner in a way it is not on a laptop. The container limits are set low on purpose
    # (8 processes, 128 MB), the runner is disposable, and dockerd on Linux survives what Docker
    # Desktop did not.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build the runner image
        # Tagged :dev because that is the default in SandboxProperties, and what DockerSandboxIT
        # asks for. Building it here also proves this Dockerfile still builds - it is the one
        # image not covered by the matrix below, since nothing in the stack runs it as a service.
        run: docker build -t codearena/arena-runner:dev arena-judge/runner

      - name: Run the isolation tests
        # -am so arena-common is built from source rather than resolved from a stale local repo.
        env:
          ARENA_SANDBOX_IT: '1'
        run: ./mvnw $MAVEN_ARGS -pl arena-judge -am verify

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'arena-judge/target/*-reports/TEST-*.xml'
          include_passed: false
          detailed_summary: true
          check_name: Sandbox isolation

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-reports
          path: 'arena-judge/target/*-reports/'
          retention-days: 7

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    # Proves the Dockerfiles still build. They compile from a clean checkout, which catches what
    # an incremental local build cannot: a clean compile re-runs the annotation processors, and
    # a MapStruct mapping that only an incremental build tolerated fails here instead of on
    # somebody else's machine.
    strategy:
      fail-fast: false
      matrix:
        service: [ arena-api, arena-judge, arena-ai ]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          # Built, not pushed: there is no registry to publish to, and the point is that the
          # build succeeds rather than that an image lands somewhere.
          push: false
          tags: codearena/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose:
    name: Smoke-test the stack
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for every service to report healthy
        # Polls compose's own health status rather than sleeping a fixed time, so a slow runner
        # is tolerated and a genuinely broken service still fails rather than passing by luck.
        run: |
          for attempt in $(seq 1 60); do
            unhealthy=$(docker compose ps --format '{{.Name}} {{.Health}}' \
              | awk '$2 != "healthy" { print $1 }')
            if [ -z "$unhealthy" ]; then
              echo "All services healthy."
              exit 0
            fi
            echo "waiting on: $unhealthy"
            sleep 10
          done
          echo "Timed out waiting for: $unhealthy"
          docker compose ps
          docker compose logs --tail 100
          exit 1

      - name: Exercise the API
        # A stack that starts but serves nothing is not a passing smoke test, so this asks for
        # real data and checks the shape of the answer.
        run: |
          set -e
          curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          curl -sf http://localhost:8080/api/v1/problems | grep -q '"content"'
          # Problem prose comes from MongoDB, so this also proves that half of the stack is wired.
          curl -sf http://localhost:8080/api/v1/problems/maximum-subarray-sum \
            | grep -q 'statementMarkdown'
          echo "API responding with seeded data."

      - name: Judge a submission end to end
        # The pipeline is the part most likely to be broken by a change that still compiles:
        # submit over HTTP, and wait for Kafka, arena-judge and the verdict listener to turn it
        # into a verdict in PostgreSQL.
        run: |
          set -e
          TOKEN=$(curl -sf -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"usernameOrEmail":"alice","password":"Password123!"}' \
            | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')
          ID=$(curl -sf -X POST http://localhost:8080/api/v1/submissions \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"problemSlug":"edit-distance","language":"JAVA","sourceCode":"public class Main { public static void main(String[] a) {} }"}' \
            | sed -n 's/.*"id":\([0-9]*\).*/\1/p')
          echo "submitted $ID"
          for attempt in $(seq 1 30); do
            STATUS=$(curl -sf -H "Authorization: Bearer $TOKEN" \
              http://localhost:8080/api/v1/submissions/$ID | sed -n 's/.*"status":"\([A-Z]*\)".*/\1/p')
            if [ "$STATUS" = "DONE" ]; then
              echo "Judged."
              exit 0
            fi
            sleep 5
          done
          echo "Submission $ID was never judged."
          docker compose logs arena-judge arena-api --tail 100
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
