# Full local stack. Services are added phase by phase; right now the pipeline is
# Postgres + arena-api. Mongo, Redis, Kafka, arena-judge, arena-ai and Ollama join in
# their respective phases.
#
#   docker compose up -d --build
#   http://localhost:8080/actuator/health

services:
  postgres:
    image: postgres:16-alpine
    container_name: arena-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codearena}
      POSTGRES_USER: ${POSTGRES_USER:-codearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codearena}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready alone reports ready during the init bootstrap restart, so also require
      # the application database to actually answer a query.
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codearena} -d ${POSTGRES_DB:-codearena} -q" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: arena-redis
    # Append-only off: everything in here is a cache rebuildable from PostgreSQL, so paying
    # for durability would be paying to persist derived data.
    command: [ "redis-server", "--appendonly", "no", "--save", "" ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  arena-api:
    build:
      context: .
      dockerfile: arena-api/Dockerfile
    image: codearena/arena-api:${ARENA_VERSION:-dev}
    container_name: arena-api
    environment:
      ARENA_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codearena}
      ARENA_DB_USERNAME: ${POSTGRES_USER:-codearena}
      ARENA_DB_PASSWORD: ${POSTGRES_PASSWORD:-codearena}
      ARENA_DB_POOL_SIZE: ${ARENA_DB_POOL_SIZE:-10}
      ARENA_LOG_LEVEL: ${ARENA_LOG_LEVEL:-INFO}
      SERVER_PORT: 8080

      # The application itself has no default for the signing key - it refuses to start
      # without one, which is the right behaviour for a deployment. The fallback here exists
      # only so `docker compose up` works on a fresh clone with no .env; override it in .env
      # for anything reachable from outside your machine.
      ARENA_JWT_SECRET: ${ARENA_JWT_SECRET:-dev-only-change-me-0123456789abcdef0123456789abcdef}
      ARENA_JWT_ISSUER: ${ARENA_JWT_ISSUER:-codearena}
      ARENA_JWT_ACCESS_TTL: ${ARENA_JWT_ACCESS_TTL:-15m}
      ARENA_JWT_REFRESH_TTL: ${ARENA_JWT_REFRESH_TTL:-7d}
      # Plain HTTP locally, so a Secure cookie would never be sent.
      ARENA_SECURE_COOKIES: ${ARENA_SECURE_COOKIES:-false}

      # Blank disables Google login; the app starts normally without it.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ARENA_OAUTH2_SUCCESS_REDIRECT: ${ARENA_OAUTH2_SUCCESS_REDIRECT:-/}

      ARENA_RATE_LIMIT_ENABLED: ${ARENA_RATE_LIMIT_ENABLED:-true}
      ARENA_RATE_LIMIT_SUBMISSIONS: ${ARENA_RATE_LIMIT_SUBMISSIONS:-10}
      ARENA_RATE_LIMIT_WINDOW: ${ARENA_RATE_LIMIT_WINDOW:-1m}

      ARENA_REDIS_HOST: redis
      ARENA_REDIS_PORT: 6379
    ports:
      - "${ARENA_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres-data:
