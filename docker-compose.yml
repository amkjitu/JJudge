# Full local stack. Services are added phase by phase; right now the pipeline is
# Postgres + arena-api. Mongo, Redis, Kafka, arena-judge, arena-ai and Ollama join in
# their respective phases.
#
#   docker compose up -d --build
#   http://localhost:8080/actuator/health

services:
  postgres:
    image: postgres:16-alpine
    container_name: arena-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codearena}
      POSTGRES_USER: ${POSTGRES_USER:-codearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codearena}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready alone reports ready during the init bootstrap restart, so also require
      # the application database to actually answer a query.
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codearena} -d ${POSTGRES_DB:-codearena} -q" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  arena-api:
    build:
      context: .
      dockerfile: arena-api/Dockerfile
    image: codearena/arena-api:${ARENA_VERSION:-dev}
    container_name: arena-api
    environment:
      ARENA_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codearena}
      ARENA_DB_USERNAME: ${POSTGRES_USER:-codearena}
      ARENA_DB_PASSWORD: ${POSTGRES_PASSWORD:-codearena}
      ARENA_DB_POOL_SIZE: ${ARENA_DB_POOL_SIZE:-10}
      ARENA_LOG_LEVEL: ${ARENA_LOG_LEVEL:-INFO}
      SERVER_PORT: 8080
    ports:
      - "${ARENA_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres-data:
