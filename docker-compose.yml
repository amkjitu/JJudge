# Full local stack: Postgres, Mongo, Redis, Kafka, arena-api, arena-judge and arena-ai.
#
#   docker compose up -d --build
#   http://localhost:8080/actuator/health
#
# Ollama is deliberately not a service here. A model worth asking for a hint is several GB
# resident, which is more than the rest of the stack put together, and the whole thing then
# needs a machine nobody should have to own to try a demo. arena-ai talks to whatever Ollama
# you point it at and falls back to a local heuristic analyser when there is none - see
# ARENA_AI_* in .env.example.

services:
  postgres:
    image: postgres:16-alpine
    container_name: arena-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codearena}
      POSTGRES_USER: ${POSTGRES_USER:-codearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codearena}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready alone reports ready during the init bootstrap restart, so also require
      # the application database to actually answer a query.
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codearena} -d ${POSTGRES_DB:-codearena} -q" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: arena-mongo
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-codearena}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # `mongosh --eval` exits non-zero when the server is not accepting queries yet, which a
      # plain TCP check would miss - the port listens well before the storage engine is ready.
      #
      # The generous timeout is about the client, not the server: mongosh is a Node application
      # and its startup alone takes several seconds on a loaded machine, so the ping answers in
      # milliseconds but the command takes ~8s to return. At the usual 5s this check fails
      # permanently against a perfectly healthy database, and every service that depends on it
      # refuses to start.
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: arena-redis
    # Append-only off: everything in here is a cache rebuildable from PostgreSQL, so paying
    # for durability would be paying to persist derived data.
    command: [ "redis-server", "--appendonly", "no", "--save", "" ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: arena-kafka
    environment:
      # KRaft: this one process is both broker and controller, so there is no ZooKeeper to run,
      # configure or explain. Single-node only - a real cluster separates the roles.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # Two advertised listeners because the address depends on who is asking: containers reach
      # the broker as "kafka", the host reaches it as "localhost". Advertising only one is the
      # classic reason a client connects, gets told to talk to an unreachable host, and hangs.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Everything below is a single-broker necessity: the defaults assume three replicas and
      # would leave the internal topics permanently under-replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: codearena-local-cluster
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    healthcheck:
      # Asking the broker to list topics proves it is actually serving the API, which a port
      # check does not - the socket opens well before the broker is ready.
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  arena-ai:
    build:
      context: .
      dockerfile: arena-ai/Dockerfile
    image: codearena/arena-ai:${ARENA_VERSION:-dev}
    container_name: arena-ai
    environment:
      # Points at an Ollama instance if you have one. host.docker.internal reaches an Ollama
      # running on the host; leave it unset and the service answers from static analysis and
      # labels every answer HEURISTIC, which is a supported way to run it.
      ARENA_OLLAMA_URL: ${ARENA_OLLAMA_URL:-http://host.docker.internal:11434}
      ARENA_OLLAMA_MODEL: ${ARENA_OLLAMA_MODEL:-llama3.2}
      ARENA_AI_ENABLED: ${ARENA_AI_ENABLED:-true}
      ARENA_AI_TIMEOUT: ${ARENA_AI_TIMEOUT:-20s}
      ARENA_LOG_LEVEL: ${ARENA_LOG_LEVEL:-INFO}
      SERVER_PORT: 8090
    # No published port. This service has no authentication of its own because its only client
    # is arena-api, which authenticates the user first - so it must stay on the internal network.
    # Publishing 8090 would hand anyone a free model endpoint.
    expose:
      - "8090"
    extra_hosts:
      # Linux does not resolve host.docker.internal by default; this makes the Ollama-on-the-host
      # case behave the same on Linux as it does on Docker Desktop.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://localhost:8090/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  arena-judge:
    build:
      context: .
      dockerfile: arena-judge/Dockerfile
    image: codearena/arena-judge:${ARENA_VERSION:-dev}
    container_name: arena-judge
    environment:
      ARENA_KAFKA_BOOTSTRAP: kafka:9092
      ARENA_JUDGE_TEST_CASES: ${ARENA_JUDGE_TEST_CASES:-20}
      ARENA_JUDGE_THREADS: ${ARENA_JUDGE_THREADS:-4}
      ARENA_JUDGE_CONSUMERS: ${ARENA_JUDGE_CONSUMERS:-2}
      ARENA_JUDGE_CASE_DELAY_MS: ${ARENA_JUDGE_CASE_DELAY_MS:-40}
      ARENA_LOG_LEVEL: ${ARENA_LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      # No HTTP server in this process, so liveness is "the JVM is still there" rather than a
      # curl against a port it never opens.
      test: [ "CMD-SHELL", "pgrep -f java > /dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  arena-api:
    build:
      context: .
      dockerfile: arena-api/Dockerfile
    image: codearena/arena-api:${ARENA_VERSION:-dev}
    container_name: arena-api
    environment:
      ARENA_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codearena}
      ARENA_DB_USERNAME: ${POSTGRES_USER:-codearena}
      ARENA_DB_PASSWORD: ${POSTGRES_PASSWORD:-codearena}
      ARENA_DB_POOL_SIZE: ${ARENA_DB_POOL_SIZE:-10}
      ARENA_LOG_LEVEL: ${ARENA_LOG_LEVEL:-INFO}
      SERVER_PORT: 8080

      # The application itself has no default for the signing key - it refuses to start
      # without one, which is the right behaviour for a deployment. The fallback here exists
      # only so `docker compose up` works on a fresh clone with no .env; override it in .env
      # for anything reachable from outside your machine.
      ARENA_JWT_SECRET: ${ARENA_JWT_SECRET:-dev-only-change-me-0123456789abcdef0123456789abcdef}
      ARENA_JWT_ISSUER: ${ARENA_JWT_ISSUER:-codearena}
      ARENA_JWT_ACCESS_TTL: ${ARENA_JWT_ACCESS_TTL:-15m}
      ARENA_JWT_REFRESH_TTL: ${ARENA_JWT_REFRESH_TTL:-7d}
      # Plain HTTP locally, so a Secure cookie would never be sent.
      ARENA_SECURE_COOKIES: ${ARENA_SECURE_COOKIES:-false}

      # Blank disables Google login; the app starts normally without it.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ARENA_OAUTH2_SUCCESS_REDIRECT: ${ARENA_OAUTH2_SUCCESS_REDIRECT:-/}

      ARENA_RATE_LIMIT_ENABLED: ${ARENA_RATE_LIMIT_ENABLED:-true}
      ARENA_RATE_LIMIT_SUBMISSIONS: ${ARENA_RATE_LIMIT_SUBMISSIONS:-10}
      ARENA_RATE_LIMIT_WINDOW: ${ARENA_RATE_LIMIT_WINDOW:-1m}

      ARENA_REDIS_HOST: redis
      ARENA_REDIS_PORT: 6379

      ARENA_MONGO_URI: mongodb://mongo:27017/${MONGO_DB:-codearena}

      ARENA_KAFKA_BOOTSTRAP: kafka:9092
      ARENA_VERDICT_CONSUMERS: ${ARENA_VERDICT_CONSUMERS:-1}
    ports:
      - "${ARENA_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
